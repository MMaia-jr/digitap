name: DigItap online read-only gate

on:
  push:
    branches:
      - test/digitap-gate-online-readonly-20261121
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/digitap-online-readonly.yml'
      - 'playwright.online.config.mjs'
      - 'tests/online-readonly/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitap-online-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-readonly:
    name: Chromium public journeys (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public read-only gate
        run: npx playwright test --config=playwright.online.config.mjs --project=chromium
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
